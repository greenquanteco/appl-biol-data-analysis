bibliography: stat_refs.bib

csl: journal-of-mammalogy.csl

format:
  html:
    theme:
      - cosmo
      - brand
    toc: true
    number-sections: true
    number-depth: 4
    fig-cap-location: top
    toc-depth: 3
    smooth-scroll: true
      
  pdf:
    mainfont: "Arial"
    monofont: "Courier New"
    documentclass: report
    toc: true
    number-sections: true
    number-depth: 4
    fig-cap-location: top
    keep-tex: true
    fontsize: "13"
    linestretch: 1.3
    geometry: 
     - margin=1in
    include-in-header: preamble.tex
    pdf-engine: xelatex
    fig-width: 6
    fig-height: 4
    

editor: visual
crossref:
  fig-title: "Figure"
  tbl-title: "Table"
  
execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  error: false
